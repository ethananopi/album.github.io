<!DOCTYPE html>

        <style>
            body {
                background-image: url(lkj.jpg);
                background-size: cover; 
                background-repeat: no-repeat;
                background-attachment: fixed;
                background-position: center;
                font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
                padding: 20px;
            }

            p {
                background-color: rgba(75, 72, 72, 0.9);
                border-radius: 10px;
                padding: 5px 15px;
                display: inline-block;
                font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
                color: #ffffff; 
                margin-top: 30px;
            }

            .tcw {
                width: 100%;
                max-width: 1500px;
                overflow-x: auto; 
                margin-top: 15px;
                margin-bottom: 30px;
                border-radius: 8px;
                border: 2px solid #494949;
                background-color: rgba(59, 5, 5, 0.5);
                padding: 10px;
            }

            .glt {
                width: 100%;
                border-collapse: collapse;
            }

            .glt td {
                border: 2px solid #424242;
                padding: 15px;
                vertical-align: middle;
                text-align: center;
                min-width: 150px; 
            }

            .tcw::-webkit-scrollbar,
            .gallery-container::-webkit-scrollbar {
                height: 4px;
                border-radius: 5px;
            }

            .tcw::-webkit-scrollbar-track,
            .gallery-container::-webkit-scrollbar-track {
                background: rgba(0, 0, 0, 0.4);
                border-radius: 5px;
            }

            .tcw::-webkit-scrollbar-thumb,
            .gallery-container::-webkit-scrollbar-thumb {
                background: #cebfbf;
                border-radius: 5px;
            }

           
             img.gallery-img {
                width: 100px;
                height: 180px;
                object-fit: cover;
                border-radius: 8px;
                transition: transform 0.5s ease;  
                cursor: pointer;}

            img.gallery-img:hover {
                transform: scale(1.15);
            }
            
            .modal {
                display: none;
                position: fixed;
                z-index: 1000;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.8);
                justify-content: center;
                align-items: center;
            }

            .modal img {
                max-width: 80%;
                max-height: 80%;
                width: auto;
                height: auto;
                border-radius: 10px;
                transform: none;
            }
            
            .close-btn {
                position: absolute;
                top: 10px;
                right: 30px;
                color: white;
                font-size: 40px;
                font-weight: bold;
                cursor: pointer;
            }

           
        </style>
    </head>

        <div id="imgModal" class="modal">
            <span class="close-btn">&times;</span>
            <img id="modalImg" src="" alt="Gambar Diperbesar">
        </div>
        
        <script>
            const modal = document.getElementById('imgModal');
            const modalImg = document.getElementById('modalImg');
            const closeBtn = document.querySelector('.close-btn');
            const images = document.querySelectorAll('.gallery-img');

            images.forEach(function(img) {
                img.addEventListener('click', function() {
                    if (this.src) {
                        modal.style.display = "flex";
                        modalImg.src = this.src;
                    }
                });
            });

            closeBtn.addEventListener('click', function() {
                modal.style.display = "none";
            });

            modal.addEventListener('click', function(e) {
                if (e.target !== modalImg) {
                    modal.style.display = "none";
                }
            });
        </script>
